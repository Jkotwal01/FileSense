[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filesense-cli"
version = "0.1.6"
description = "A local CLI-based file analysis and deduplication engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "psutil>=5.9.8"
]

[project.scripts]
filesense = "filesense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["filesense"]
